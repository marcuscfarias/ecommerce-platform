services:
  ecommerce-api:
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTPS_PORTS=8081
      - Cors__AllowedOrigins__0=https://localhost:7777
      - Cors__AllowedOrigins__1=https://localhost:7778
      - Email__Provider=Console
      - Email__FromAddress=noreply@localhost
      - "Email__FromName=Ecommerce (dev)"
      - Auth__EmailConfirmation__ApiBaseUrl=https://localhost:8081
      - Auth__EmailConfirmation__ShopBaseUrl=https://localhost:7778
      - Messaging__Enabled=true
      - ConnectionStrings__RabbitMq=amqp://${RABBITMQ_DEFAULT_USER:-ecommerce}:${RABBITMQ_DEFAULT_PASS:-ecommerce}@ecommerce-rabbitmq:5672/
      - "ProductImageStorage__ConnectionString=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    depends_on:
      azurite:
        condition: service_started
    volumes:
      - ${USERPROFILE}/.aspnet/https:/https:ro

  ecommerce-db:
    env_file:
      - .env
    ports:
      - "5432:5432"

  azurite:
    container_name: ecommerce-azurite
    image: mcr.microsoft.com/azure-storage/azurite
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 -l /data" #persist data
    ports:
      - "10000:10000"
    volumes:
      - ecommerce-azurite-data:/data
    networks:
      - ecommerce-net

  ecommerce-rabbitmq:
    container_name: ecommerce-rabbitmq
    image: rabbitmq:4-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-ecommerce}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-ecommerce}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ecommerce-net

volumes:
  ecommerce-azurite-data:
