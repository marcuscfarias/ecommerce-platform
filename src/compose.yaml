services:
  ecommerce-api:
    container_name: ecommerce-api
    image: ecommerce
    build:
      context: .
      dockerfile: Ecommerce.AppHost/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - ConnectionStrings__EcommerceDb
    depends_on:
      ecommerce-db:
        condition: service_healthy
    networks:
      - ecommerce-net

  ecommerce-db:
    container_name: ecommerce-db
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=ecommerce
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    volumes:
      - ecommerce-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ecommerce-net

volumes:
  ecommerce-db-data:

networks:
  ecommerce-net:
    driver: bridge
