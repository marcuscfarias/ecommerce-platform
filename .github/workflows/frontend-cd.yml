name: Frontend CD

on:
  push:
    branches: [main]
    paths:
      - 'src/Ecommerce.Admin.Web/**'
      - 'src/Ecommerce.Shop.Web/**'
      - '.github/workflows/frontend-cd.yml'
  workflow_dispatch: # manual redeploy / rollback

concurrency:
  group: frontend-cd
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # mint the short-lived OIDC token for azure/login
      contents: read

    # One entry per SPA, each with its own Static Web App. The path filter above is
    # workflow-level, so a commit touching one SPA republishes both — idempotent upload,
    # and it keeps the two SPAs on the same commit.
    strategy:
      # Never let one SPA's failure cancel the other's deploy.
      fail-fast: false
      matrix:
        include:
          - name: backoffice
            app_location: src/Ecommerce.Admin.Web
            swa_name: ${{ vars.AZURE_SWA_ADMIN }}
          - name: store
            app_location: src/Ecommerce.Shop.Web
            swa_name: ${{ vars.AZURE_SWA_SHOP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # OIDC login — same app registration as Backend CD; no Azure secret stored.
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Fetch the SWA deployment token just-in-time via OIDC instead of storing it.
      - name: Fetch SWA deployment token
        id: swa
        run: |
          token=$(az staticwebapp secrets list \
            --name "${{ matrix.swa_name }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: ${{ matrix.app_location }}
          output_location: wwwroot
